---
reverse_http:
  - server_name: "some-url.website.net"
    host_header: "some-url.website.net"
    listen_port: 443
    ssl: true
    ssl_certificate: "/etc/ssl/certs/website-cert.pem"
    ssl_certificate_key: "/etc/ssl/private/website-key.pem"
    ssl_force_redirect: true
    locations:
      - path: "/"
        backend: "site_main"
        upgrade: false
        allow_hosts: []
        auth_basic: false
        read_timeout: 600
        send_timeout: 600
        client_max_body_size: 10M
      - path: "/ws"
        backend: "site_ws"
        upgrade: true
        allow_hosts: []
        auth_basic: false
        read_timeout: 600
        send_timeout: 600
        client_max_body_size: 10M
      - path: "/wsconfig"
        backend: "site_main"
        upgrade: false
        allow_hosts: []
        auth_basic: false
        read_timeout: 600
        send_timeout: 600
        client_max_body_size: 10M
    backends:
      - name: site_main
        protocol: http
        address: 192.168.1.100:4236
      - name: site_ws
        protocol: http
        address: 192.168.1.100:4237

  - server_name: www.myotherurl.net
    host_header: www.myotherurl.net
    listen_port: 80
    ssl: false
    ssl_force_redirect: false
    locations:
      - path: "/"
        backend: "othersite_main"
        upgrade: false
        allow_hosts: []
        auth_basic: true
        auth_basic_prompt: "Restricted Access"
        auth_basic_user_file: "/etc/nginx/.htpasswd"
        read_timeout: 300
        send_timeout: 300
        client_max_body_size: 100M
    backends:
      - name: othersite_main
        protocol: http
        address: 10.50.9.167:80

  - server_name: www.yetanotherurl.net
    host_header: localhost
    listen_port: 443
    ssl: true
    ssl_certificate: /etc/nginx/tls/myotherurl.crt
    ssl_certificate_key: /etc/nginx/tls/myotherurl.key
    ssl_force_redirect: true
    locations:
      - path: "/"
        backend: "yetanothersite_backend"
        upgrade: false
        satisfy_policy: any # mandatory when both allow_hosts is populated and auth_basic is true : "any" or "all"
        allow_hosts: # mandatory - empty list or '0.0.0.0/0' to allow all hosts
          - 192.168.30.254
          - 192.168.40.0/24
        auth_basic: true
        auth_basic_prompt: "Yet another url - Restricted Access"
        auth_basic_user_file: "/etc/nginx/yet.htpasswd"
        read_timeout: 600
        send_timeout: 600
        client_max_body_size: 10M
    backends:
      - name: yetanothersite_backend
        protocol: http
        address: 127.0.0.1:80

reverse_tcp:
  - listen_port: 12345
    backends:
      - 10.0.0.1:12345
      - 10.0.0.2:12345

reverse_udp:
  - listen_port: 9000
    backends:
      - 10.0.0.3:9000
      - 10.0.0.4:9000
